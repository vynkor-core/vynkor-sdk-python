[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vynkor-sdk"
version = "0.0.3"
description = "Python SDK for writing Vynkor plugins — async IPC client (UDS + WebSocket), Plugin trait, and full Vynkor wire protocol (framing, zstd compression, HMAC frame MACs, fragmentation, raw audio)."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.9"
authors = [
    { name = "vynkor-core", email = "btemirkhodjaev@gmail.com" },
]
keywords = ["vynkor", "plugin", "ipc", "sdk", "kernel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # pb2 regenerated with protoc 6.33.5 (gencode 6.33.5); runtime major must match.
    "protobuf>=6.33.5",
    # decompress FLAG_COMPRESSED frames (kernel zstd-compresses payloads >= 64 KiB)
    "zstandard>=0.22",
    # WebSocket transport (remote devices, D-05) — mirrors Rust tokio-tungstenite
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.50",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
fuzz = [
    # T-14: fuzz/fuzz_framing.py harness for vynkor.framing.read_frame.
    "atheris>=2.3; platform_system != 'Windows'",
]

[project.urls]
Homepage = "https://github.com/vynkor-core/vynkor-sdk-python"
Repository = "https://github.com/vynkor-core/vynkor-sdk-python"
Documentation = "https://github.com/vynkor-core/vynkor-sdk-python"
Issues = "https://github.com/vynkor-core/vynkor-sdk-python/issues"

[tool.pytest.ini_options]
# tests/ imports the in-tree package directly (no install needed).
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["vynkor"]
